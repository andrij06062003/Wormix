<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wormix</title>
    <style>
        :root { --bg: #1d1d1d; --panel: #2a2a2a; --text: #e6e6e6; --muted: #9a9a9a; --accent: #f0a020; --error: #ff6b6b; }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px system-ui, sans-serif; }
        /* container-type: the chat below is sized in cqw/cqh, so it scales with the game (and stays inside it in
           full screen, where this box is what goes full screen). */
        #game { position: relative; width: 900px; max-width: 100%; aspect-ratio: 3 / 2; margin: 20px auto 8px; container-type: size; }
        #game ruffle-player, #game ruffle-object, #game ruffle-embed { width: 100%; height: 100%; }
        /* Full screen goes to this box (see startGame). The 3:2 game is shown at 16:10, a light stretch,
           and the narrow strips left on a 16:9 screen show the page background. */
        #game:fullscreen { width: 100vw; height: 100vh; max-width: none; margin: 0; aspect-ratio: auto;
                           display: flex; align-items: center; justify-content: center; background: var(--bg); }
        #game:fullscreen ruffle-player { width: min(100vw, 160vh); height: auto; aspect-ratio: 16 / 10; }
        #bar { text-align: center; color: var(--muted); font-size: 13px; }
        #bar button { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; }
        #login { max-width: 320px; margin: 80px auto; padding: 24px; background: var(--panel); border-radius: 10px; }
        #login h1 { margin: 0 0 16px; font-size: 22px; text-align: center; }
        #login label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
        #login input { box-sizing: border-box; width: 100%; padding: 9px 10px; border: 1px solid #444; border-radius: 6px;
                       background: #1b1b1b; color: var(--text); font: inherit; }
        #login .buttons { display: flex; gap: 8px; margin-top: 18px; }
        #login button { flex: 1; padding: 10px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; }
        #login .primary { background: var(--accent); color: #1d1d1d; }
        #login .secondary { background: #3a3a3a; color: var(--text); }
        #msg { min-height: 20px; margin-top: 12px; color: var(--error); font-size: 13px; text-align: center; }
        [hidden] { display: none !important; }

        /* Profile: avatar, nickname (once in 60 days), login and password. "Профіль" under the game opens it. */
        #bar img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; vertical-align: middle; margin-right: 4px; }
        #profile { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
                   background: rgba(0, 0, 0, .6); overflow: auto; }
        #profile .card { position: relative; width: min(460px, 100%); box-sizing: border-box; padding: 22px;
                         background: var(--panel); border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .6); }
        #profile h2 { margin: 0 0 16px; font-size: 19px; }
        #profile h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
        #profile section { margin-top: 16px; padding-top: 14px; border-top: 1px solid #3a3a3a; }
        #profile label { display: block; margin: 8px 0 4px; color: var(--muted); font-size: 13px; }
        #profile input:not([type=range]):not([type=file]) { box-sizing: border-box; width: 100%; padding: 8px 10px;
                         border: 1px solid #444; border-radius: 6px; background: #1b1b1b; color: var(--text); font: inherit; }
        #profile input:disabled { opacity: .6; }
        #profile .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
        #profile .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #profile .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
        .pbtn { padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
                background: #3a3a3a; color: var(--text); }
        .pbtn.primary { background: var(--accent); color: #1d1d1d; }
        .pbtn:disabled { opacity: .5; cursor: default; }
        #pfClose { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; padding: 0; font-size: 16px; }
        .pfHead { display: flex; gap: 16px; align-items: center; }
        #pfAva { width: 88px; height: 88px; flex: none; border-radius: 10px; object-fit: cover; background: #333; }
        #pfName { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
        #pfMeta { color: var(--muted); font-size: 13px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 0; }
        .stats div { padding: 8px 4px; border-radius: 8px; background: #222; text-align: center; }
        .stats dt { color: var(--muted); font-size: 12px; } .stats dd { margin: 2px 0 0; font-size: 16px; font-weight: 700; }
        #pfCrop { display: grid; justify-items: center; gap: 10px; margin-top: 12px; }
        #pfCanvas { width: 200px; height: 200px; border-radius: 10px; cursor: grab; touch-action: none; background: #111; }
        #pfZoom { width: 200px; accent-color: var(--accent); }
        #pfMsg { min-height: 18px; margin-top: 14px; font-size: 13px; text-align: center; }
        #pfMsg.err { color: var(--error); } #pfMsg.ok { color: #7bd17b; }
        #pfRestart { margin-top: 8px; padding: 10px; border-radius: 8px; background: rgba(240, 160, 32, .12); font-size: 13px; }
        #pfOther { margin-top: 16px; }
        #bar .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: #d9342b; color: #fff;
                      font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; }

        /* The chat, drawn like the game's own windows (parchment in a wooden frame, a plaque with the title,
           the round red close button and the green button), over the game. */
        #chat { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(0, 0, 0, .35);
                font: bold 1.55cqw/1.3 "Trebuchet MS", Arial, sans-serif; color: #6e4321; }
        .gwin { position: relative; width: 74cqw; height: 74cqh; box-sizing: border-box; padding: 4.2cqw 1.6cqw 1.6cqw;
                background: #f1dfb0; border: .45cqw solid #a77a43; border-radius: 1.6cqw;
                box-shadow: inset 0 0 0 .35cqw #f8ecc8, inset 0 0 0 .7cqw #c99f62, 0 .8cqw 2cqw rgba(0, 0, 0, .45); }
        .gtitle { position: absolute; left: 50%; top: -1.9cqw; transform: translateX(-50%); padding: .8cqw 4cqw; white-space: nowrap;
                  background: linear-gradient(#fbefcc, #ecd5a0); border: .35cqw solid #a77a43; border-radius: .9cqw;
                  box-shadow: 0 .3cqw 0 #8c6233; font-size: 2.1cqw; color: #5b3615; }
        .gclose { position: absolute; right: -1.8cqw; top: -1.8cqw; width: 4.6cqw; height: 4.6cqw; padding: 0; border-radius: 50%;
                  border: .35cqw solid #fff; background: radial-gradient(circle at 35% 30%, #f26b5b, #c4161c 70%); color: #fff;
                  font: bold 2.4cqw/1 Arial, sans-serif; cursor: pointer; box-shadow: 0 .25cqw .5cqw rgba(0, 0, 0, .4); }
        .gclose:hover { filter: brightness(1.1); }
        .gbody { display: grid; grid-template-columns: 30% 1fr; gap: 1.2cqw; height: 100%; min-height: 0; }
        .gpanel { background: #fbf3dc; border-radius: 1cqw; box-shadow: inset 0 0 0 .25cqw #e3c98f; min-height: 0; }
        .gside { overflow-y: auto; padding: .8cqw; }
        .gtab { display: flex; align-items: center; gap: .8cqw; padding: .6cqw .8cqw; border-radius: .8cqw; cursor: pointer; }
        .gtab:hover { background: #f3e2b0; }
        .gtab.on { background: #e9cf8f; box-shadow: inset 0 0 0 .2cqw #c99f62; }
        .gtab img, .gmsg img { width: 3.6cqw; height: 3.6cqw; flex: none; border-radius: .6cqw; object-fit: cover; background: #e3c98f;
                               border: .2cqw solid #c99f62; }
        .gtab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .gtab .gnew { flex: none; min-width: 1.8cqw; padding: 0 .4cqw; border-radius: 1cqw; background: #d9342b; color: #fff; font-size: 1.2cqw;
                      line-height: 1.8cqw; text-align: center; }
        .groom { display: grid; place-items: center; width: 3.6cqw; height: 3.6cqw; flex: none; border-radius: .6cqw; background: #7cc242;
                 color: #fff; font-size: 2cqw; border: .2cqw solid #4e8f22; }
        .gmain { display: grid; grid-template-rows: auto 1fr auto; gap: .8cqw; min-height: 0; }
        .ghead { padding: .6cqw 1cqw; font-size: 1.8cqw; color: #5b3615; }
        .glog { overflow-y: auto; padding: .8cqw 1cqw; }
        .gempty { margin-top: 6cqh; text-align: center; color: #a98458; }
        .gmsg { display: flex; gap: .8cqw; margin-bottom: .9cqw; }
        .gmsg .gwho { cursor: pointer; color: #9b4a12; } .gmsg .gwho:hover { text-decoration: underline; }
        .gmsg.mine .gwho { color: #3f7d16; cursor: default; text-decoration: none; }
        .gmsg time { margin-left: .6cqw; color: #b39468; font-size: 1.15cqw; font-weight: normal; }
        .gmsg p { margin: .2cqw 0 0; font-weight: normal; color: #4a2e14; overflow-wrap: anywhere; white-space: pre-wrap; }
        .gsend { display: flex; gap: .8cqw; }
        .gsend input { flex: 1; min-width: 0; padding: .8cqw 1cqw; border: .25cqw solid #c99f62; border-radius: .8cqw; background: #fffaf0;
                       color: #4a2e14; font: inherit; font-weight: normal; outline: none; }
        .gsend input:focus { border-color: #8c6233; }
        .ggreen { padding: .7cqw 2.2cqw; border: .25cqw solid #e6ffd0; border-radius: .9cqw; cursor: pointer;
                  background: linear-gradient(#8fdc3c, #3f9b12); color: #fff; font: inherit; font-size: 1.7cqw;
                  text-shadow: 0 0 .25cqw #24600a, 0 .15cqw 0 #24600a; box-shadow: 0 .3cqw 0 #2c6c0c; }
        .ggreen:hover { filter: brightness(1.07); } .ggreen:disabled { filter: grayscale(.6); cursor: default; }
        .gerr { min-height: 1.6cqw; color: #c4161c; font-size: 1.2cqw; }
        /* A private message while the chat is closed. */
        #gtoast { position: absolute; left: 50%; top: 2cqh; z-index: 8; transform: translateX(-50%); max-width: 60cqw; display: flex;
                  align-items: center; gap: 1cqw; padding: .8cqw 1.6cqw; cursor: pointer; background: #fbf3dc; border: .35cqw solid #a77a43;
                  border-radius: 1.2cqw; box-shadow: 0 .5cqw 1.2cqw rgba(0, 0, 0, .4); font: bold 1.5cqw/1.3 "Trebuchet MS", Arial, sans-serif;
                  color: #6e4321; }
        #gtoast img { width: 3.4cqw; height: 3.4cqw; border-radius: .6cqw; object-fit: cover; }
        #gtoast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @media (max-width: 440px) { .stats { grid-template-columns: repeat(2, 1fr); } #profile .two { grid-template-columns: 1fr; } }
    </style>
    <!-- Ruffle: open-source Flash Player emulator (https://ruffle.rs) -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
</head>
<body>

<form id="login" hidden>
    <h1>Wormix</h1>
    <label for="name">Логін</label>
    <input id="name" autocomplete="username" required minlength="3">
    <label for="pass">Пароль (щонайменше 8 символів)</label>
    <input id="pass" type="password" autocomplete="current-password" required minlength="8">
    <div class="buttons">
        <button type="submit" class="primary" data-action="sign_in">Увійти</button>
        <button type="submit" class="secondary" data-action="sign_up">Реєстрація</button>
    </div>
    <div id="msg"></div>
</form>

<div id="game">
<div id="chat" hidden>
    <div class="gwin" role="dialog" aria-modal="true" aria-labelledby="gTitle">
        <div class="gtitle" id="gTitle">Чат</div>
        <button class="gclose" id="gClose" type="button" title="Закрыть (Esc)">✕</button>
        <div class="gbody">
            <div class="gpanel gside" id="gTabs"></div>
            <div class="gmain">
                <div class="gpanel ghead" id="gHead">Общий чат</div>
                <div class="gpanel glog" id="gLog"></div>
                <div>
                    <form class="gsend" id="gForm">
                        <input id="gText" maxlength="300" autocomplete="off" placeholder="Написать сообщение…" aria-label="Сообщение">
                        <button class="ggreen" id="gSendBtn" type="submit">Отправить</button>
                    </form>
                    <div class="gerr" id="gErr"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="gtoast" hidden></div>

<div id="profile" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="pfTitle">
        <button id="pfClose" class="pbtn" type="button" title="Закрити (Esc)">✕</button>
        <h2 id="pfTitle">Мій профіль</h2>
        <div class="pfHead">
            <img id="pfAva" alt="Аватарка">
            <div><div id="pfName"></div><div id="pfMeta"></div></div>
        </div>
        <dl class="stats">
            <div><dt>Рівень</dt><dd id="stLevel">–</dd></div>
            <div><dt>Рейтинг</dt><dd id="stRating">–</dd></div>
            <div><dt>Фузи</dt><dd id="stMoney">–</dd></div>
            <div><dt>Рубіни</dt><dd id="stRubies">–</dd></div>
        </dl>

        <div id="pfOther" class="row" hidden>
            <button id="pfWrite" class="pbtn primary" type="button">Написати повідомлення</button>
        </div>
        <div id="pfOwn">
        <section>
            <h3>Аватарка</h3>
            <div class="row">
                <button id="pfPick" class="pbtn primary" type="button">Вибрати фото…</button>
                <span class="note">JPG або PNG, від 100×100</span>
            </div>
            <input id="pfFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            <div id="pfCrop" hidden>
                <canvas id="pfCanvas" width="256" height="256" title="Перетягніть, щоб вибрати частину фото"></canvas>
                <input id="pfZoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="Масштаб">
                <div class="row">
                    <button id="pfSaveAva" class="pbtn primary" type="button">Зберегти аватарку</button>
                    <button id="pfCancelAva" class="pbtn" type="button">Скасувати</button>
                </div>
            </div>
        </section>

        <section>
            <h3>Нікнейм</h3>
            <form id="pfNickForm">
                <input id="pfNick" maxlength="20" required aria-label="Нікнейм">
                <div id="pfNickNote" class="note">Так вас бачать інші гравці. Змінювати можна раз на 60 днів.</div>
                <div class="row"><button id="pfNickSave" class="pbtn primary" type="submit">Змінити нікнейм</button></div>
            </form>
        </section>

        <section>
            <h3>Логін і пароль</h3>
            <form id="pfLoginForm">
                <label for="pfLogin">Логін (для входу в гру)</label>
                <input id="pfLogin" maxlength="32" autocomplete="username" required>
                <label for="pfPass">Новий пароль (порожньо — не змінювати)</label>
                <div class="two">
                    <input id="pfPass" type="password" minlength="8" autocomplete="new-password" placeholder="Новий пароль">
                    <input id="pfPass2" type="password" minlength="8" autocomplete="new-password" placeholder="Ще раз">
                </div>
                <label for="pfCurrent">Поточний пароль</label>
                <input id="pfCurrent" type="password" autocomplete="current-password" required>
                <div class="row"><button class="pbtn primary" type="submit">Зберегти логін і пароль</button></div>
            </form>
        </section>

        </div>
        <div id="pfMsg"></div>
        <div id="pfRestart" hidden>
            <div class="row" style="margin-top:0; justify-content:space-between">
                <span>У грі зміни з'являться після перезапуску.</span>
                <button id="pfReload" class="pbtn primary" type="button">Перезапустити гру</button>
            </div>
        </div>
    </div>
</div>
</div>
<div id="bar" hidden><img id="barAva" alt=""><span id="who"></span> · <button id="profileBtn" type="button">Профіль</button> · <button id="chatBtn" type="button">Чат <span id="chatBadge" class="badge" hidden></span></button> · <button id="logout" type="button">Вийти</button></div>

<script>
    // Everything (this page, the API at /api/ and the game connections) is served by the game host
    // (wormix-relay) from one address, so the page works the same on any computer.
    const API = location.origin + '/api/';
    const RELAY = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
    // The Wormix.swf build: change it whenever a client patch changes Wormix.swf (see urlRewriteRules).
    const CLIENT_BUILD = '2026-11-09.1';

    // Remembered login, per browser (convenience only).
    const store = {
        get() { try { return JSON.parse(localStorage.getItem('wormix_session') || 'null'); } catch { return null; } },
        set(v) { try { localStorage.setItem('wormix_session', JSON.stringify(v)); } catch { } },
        clear() { try { localStorage.removeItem('wormix_session'); } catch { } }
    };

    // body: an object (sent as JSON) or FormData (a file upload).
    async function api(path, { body, token, method = 'POST' } = {}) {
        const form = body instanceof FormData;
        const res = await fetch(API + path, {
            method,
            headers: {
                'Accept': 'application/json',
                ...(body && !form ? { 'Content-Type': 'application/json' } : {}),
                ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            },
            body: form ? body : body ? JSON.stringify(body) : undefined
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const err = new Error(data.message || ('HTTP ' + res.status));
            err.status = res.status;
            err.data = data;
            throw err;
        }
        return data;
    }

    // --- Login / registration -------------------------------------------------------------
    const form = document.getElementById('login');
    const msg = document.getElementById('msg');
    let action = 'sign_in';
    form.querySelectorAll('button[data-action]').forEach(b => b.addEventListener('click', () => action = b.dataset.action));

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        const login = document.getElementById('name').value.trim();
        const password = document.getElementById('pass').value;
        try {
            const body = action === 'sign_up'
                ? { login, password, password_confirmation: password }
                : { login, password };
            const r = await api('account/' + action, { body });
            store.set({ id: r.id, token: r.auth_token, login });
            await startGame();
        } catch (err) {
            msg.textContent = action === 'sign_up'
                ? 'Не вдалося зареєструватися: ' + err.message + ' (можливо, логін уже зайнятий)'
                : 'Неправильний логін або пароль';
        }
    });

    document.getElementById('logout').addEventListener('click', async () => {
        const s = store.get();
        store.clear();
        if (s) api('account/sign_out', { token: s.token }).catch(() => { });
        location.reload();
    });

    // --- Game --------------------------------------------------------------------------------
    async function startGame() {
        const s = store.get();
        if (!s) { form.hidden = false; return; }

        let authKey;
        try {
            authKey = (await api('account/game', { token: s.token })).auth_key;
        } catch (err) {
            store.clear();
            form.hidden = false;
            msg.textContent = 'Сесія закінчилася, увійдіть знову';
            return;
        }

        form.hidden = true;
        document.getElementById('bar').hidden = false;
        // The game id is what friends enter in "call by id" to challenge this player.
        document.getElementById('who').textContent = s.login + ' · ID ' + s.id;
        document.getElementById('barAva').src = photoUrl(null);
        startChat();
        loadAccount().then(showBarAccount).catch(() => { });

        const id = String(s.id);
        const flashvars = {
            api_id: '2', api_settings: '8479', viewer_type: '2', sid: 'smtp', secret: 'smtp',
            access_token: '', user_id: id, viewer_id: id, group_id: '0', is_app_user: '1',
            language: '0', parent_language: '0', ad_info: '', is_secure: '0', ads_app_id: 'smtp',
            referrer: 'unknown', lc_name: 'smtp', hash: '', api_url: API, auth_key: authKey
        };

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: 'on',
            unmuteOverlay: 'hidden',
            allowScriptAccess: true,
            // The game is 900x600 (3:2). Stretch it to fill the player instead of drawing black bars;
            // the page decides the player's shape (3:2 normally, 16:10 in full screen).
            // forceScale keeps the game from switching it back.
            scale: 'exactFit',
            forceScale: true,
            letterbox: 'off',
            logLevel: 'warn',
            // Flash aborts scripts that run longer than 15 s. Building the destructible map is heavy
            // and slower in Ruffle than in the old Flash Player, so allow more time.
            maxExecutionDuration: 120,
            urlRewriteRules: [
                // Cloudflare tells browsers to keep .swf files for 4 hours, so a patched Wormix.swf would reach
                // players hours later. Ask for it with the build number: change CLIENT_BUILD with every patch.
                [new RegExp('^https?://[^/]+/vk/1\\.25\\.0/Wormix\\.swf(\\?.*)?$'), location.origin + '/vk/1.25.0/Wormix.swf?b=' + CLIENT_BUILD],
                // The client asks for map<N>.swf, a version of each map; we have one version (map.swf).
                // Its preloader has http://127.0.0.1:32700/vk/1.25.0/ built in, and only the first matching
                // rule applies, so this one comes before the 127.0.0.1:32700 one.
                [new RegExp('^https?://[^/]+/vk/storage/levels/([^/?]+)/map[0-9]*\\.swf(\\?.*)?$'), location.origin + '/vk/storage/levels/$1/map.swf'],
                // The preloader has http://127.0.0.1:32700/vk/1.25.0/ built in as the place to load the game
                // from. Send those requests to wherever this page is served (any domain, http or https).
                [new RegExp('^https?://(127\\.0\\.0\\.1|localhost):32700/(.*)$'), location.origin + '/$2'],
                // Achievements are plain HTTP to <game server>:49199/wormix_achieve/ (not a socket):
                // the game host answers them itself (Achievements.cs).
                [new RegExp('^https?://(wormixtest\\.ru|battle\\.wormixtest\\.ru|localhost|127\\.0\\.0\\.1):49199/(.*)$'), location.origin + '/$2'],
            ],
            // Browsers can't open raw TCP sockets, so Ruffle sends the game's connections through
            // the game host (ws://<host>/<port>), which forwards them to wormix-core.
            // The game has wormixtest.ru built in; these entries send it to our own server instead.
            // Ports built into the preloader: 49196, 49197 main, 49198 PvP, 49199 achievements.
            socketProxy: [49196, 49197, 49198, 49199, 49297, 49298, 49299, 49300].flatMap(port =>
                ['wormixtest.ru', 'battle.wormixtest.ru', 'localhost', '127.0.0.1'].map(host => ({
                    host, port, proxyUrl: RELAY + '/' + port
                })))
        };

        // Debug mode (play.html?debug): forward the game's log lines and Ruffle's warnings/errors
        // to the game host, which prints them in its terminal.
        if (new URLSearchParams(location.search).has('debug')) {
            const queue = [];
            const keep = /WLOG|ERROR|rror|ncaught|stub|panic/;
            const original = console.log.bind(console);
            const clean = s => String(s).replace(/%c/g, '');
            console.log = (...args) => {
                original(...args);
                const line = clean(args[0]);
                if (keep.test(line)) queue.push(line.replace(/\s+/g, ' ').trim());
            };
            setInterval(() => {
                if (!queue.length) return;
                const body = queue.splice(0).join('\n');
                fetch('/debug-log', { method: 'POST', body }).catch(() => { });
            }, 1000);
        }

        const player = window.RufflePlayer.newest().createPlayer();
        const box = document.getElementById('game');
        box.appendChild(player);
        // Ruffle's "full screen" puts the player element itself in full screen, where it always fills
        // the whole screen. Put the game box in full screen instead, so the CSS above sets the shape.
        player.requestFullscreen = options => box.requestFullscreen(options);
        player.webkitRequestFullscreen = options => box.webkitRequestFullscreen && box.webkitRequestFullscreen(options);
        player.ruffle().load({ url: 'vk/1.25.0/preloader.swf?v=1', parameters: flashvars, base: 'vk/1.25.0/' })
            .catch(err => { document.getElementById('who').textContent = 'Ruffle failed to load: ' + err; });
    }

    // --- Profile -------------------------------------------------------------------------------
    // Your avatar (cropped to a square here, then uploaded), the nickname other players see (once in 60 days,
    // the server checks it), the login and the password (both only with the current password).
    // Another player's profile ("Страница пользователя" in the game) only shows it, with "write a message".
    const $ = id => document.getElementById(id);
    const profileBox = $('profile'), pfMsg = $('pfMsg');
    let account = null;     // GET /api/account
    let changed = false;    // the game shows the old avatar and name until it restarts

    // A missing photo comes back as the default picture.
    const photoUrl = photo => API + 'photos/users/' + encodeURIComponent(photo || 'none');
    const nickOf = a => [a.social_data?.first_name, a.social_data?.last_name].filter(Boolean).join(' ') || a.login;
    const dateUk = iso => new Date(iso).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' });

    async function loadAccount(id) {
        const s = store.get();
        const path = id == null || String(id) === String(s.id) ? 'account' : 'account/info/' + encodeURIComponent(id);
        return (await api(path, { token: s.token, method: 'GET' })).data;
    }

    function showBarAccount(a) {
        $('barAva').src = photoUrl(a.social_data?.photo);
        $('who').textContent = nickOf(a) + ' · ID ' + a.id;
    }

    function say(text, kind = 'err') { pfMsg.textContent = text; pfMsg.className = text ? kind : ''; }

    let viewedId = null;    // the player whose profile is open (null: your own)

    async function openProfile(id) {
        const s = store.get();
        if (!s) return;
        const own = id == null || id === '' || String(id) === String(s.id);
        viewedId = own ? null : String(id);
        closeChat();
        profileBox.hidden = false;
        say('');
        cancelCrop();
        $('pfOwn').hidden = !own;
        $('pfOther').hidden = own;
        $('pfTitle').textContent = own ? 'Мій профіль' : 'Профіль гравця';
        $('pfRestart').hidden = !(own && changed);
        $('pfAva').src = photoUrl(null);
        $('pfName').textContent = '…';
        $('pfMeta').textContent = '';
        for (const k of ['stLevel', 'stRating', 'stMoney', 'stRubies']) $(k).textContent = '–';
        $('pfClose').focus();
        try {
            const a = await loadAccount(viewedId);
            if (own) account = a;
            fillProfile(a, own);
        } catch (err) {
            $('pfName').textContent = '';
            say(err.status === 404 ? 'Гравця не знайдено' : 'Не вдалося завантажити профіль: ' + err.message);
        }
    }

    function fillProfile(a = account, own = true) {
        const p = a.user_profile || {}, w = a.worm_data || {};
        $('pfAva').src = photoUrl(a.social_data?.photo);
        $('pfName').textContent = nickOf(a);
        $('pfMeta').textContent = (own ? 'Логін ' + a.login + ' · ' : '') + 'ID ' + a.id;
        $('stLevel').textContent = w.level ?? '–';
        $('stRating').textContent = p.rating ?? '–';
        $('stMoney').textContent = p.money ?? '–';
        $('stRubies').textContent = p.real_money ?? '–';
        if (!own) return;
        $('pfNick').value = nickOf(a);
        $('pfLogin').value = a.login;
        const next = a.social_data?.next_name_change_at;
        $('pfNick').disabled = $('pfNickSave').disabled = !!next;
        $('pfNickNote').textContent = next
            ? 'Наступна зміна нікнейму: ' + dateUk(next)
            : 'Так вас бачать інші гравці. Змінювати можна раз на 60 днів.';
        showBarAccount(a);
    }

    function closeProfile() {
        if (profileBox.hidden) return;
        profileBox.hidden = true;
        cancelCrop();
        $('pfCurrent').value = $('pfPass').value = $('pfPass2').value = '';
        const p = document.querySelector('#game ruffle-player');
        if (p) p.focus();
    }

    function markChanged(text) {
        changed = true;
        say(text, 'ok');
        $('pfRestart').hidden = false;
    }

    $('profileBtn').addEventListener('click', () => openProfile());
    $('pfWrite').addEventListener('click', () => { const id = viewedId; closeProfile(); openChat(id); });
    $('pfClose').addEventListener('click', closeProfile);
    profileBox.addEventListener('pointerdown', e => { if (e.target === profileBox) closeProfile(); });
    profileBox.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); closeProfile(); } });
    $('pfReload').addEventListener('click', () => location.reload());

    // The avatar: pick a photo, drag and zoom it in the square, save it as a 256x256 JPEG.
    const canvas = $('pfCanvas'), ctx = canvas.getContext('2d'), zoom = $('pfZoom');
    const crop = { img: null, base: 1, x: 0, y: 0, zoom: 1 };

    function cancelCrop() {
        $('pfCrop').hidden = true;
        crop.img = null;
        $('pfFile').value = '';
    }

    function drawCrop() {
        const { img } = crop;
        if (!img) return;
        const k = crop.base * crop.zoom, w = img.naturalWidth * k, h = img.naturalHeight * k;
        // The photo always covers the whole square.
        crop.x = Math.min(0, Math.max(canvas.width - w, crop.x));
        crop.y = Math.min(0, Math.max(canvas.height - h, crop.y));
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, crop.x, crop.y, w, h);
    }

    $('pfPick').addEventListener('click', () => $('pfFile').click());
    $('pfFile').addEventListener('change', () => {
        const file = $('pfFile').files[0];
        if (!file) return;
        say('');
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(img.src);
            if (img.naturalWidth < 100 || img.naturalHeight < 100) return say('Фото замале: потрібно щонайменше 100×100');
            crop.img = img;
            crop.base = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
            crop.zoom = 1;
            zoom.value = 1;
            crop.x = (canvas.width - img.naturalWidth * crop.base) / 2;
            crop.y = (canvas.height - img.naturalHeight * crop.base) / 2;
            $('pfCrop').hidden = false;
            drawCrop();
        };
        img.onerror = () => say('Це не схоже на фото (потрібен JPG або PNG)');
        img.src = URL.createObjectURL(file);
    });

    // Zoom around the middle of the square.
    zoom.addEventListener('input', () => {
        const r = Number(zoom.value) / crop.zoom, c = canvas.width / 2;
        crop.x = c - (c - crop.x) * r;
        crop.y = c - (c - crop.y) * r;
        crop.zoom = Number(zoom.value);
        drawCrop();
    });
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        zoom.value = Math.min(4, Math.max(1, crop.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
        zoom.dispatchEvent(new Event('input'));
    }, { passive: false });
    let drag = null;
    canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e => {
        if (!drag) return;
        const s = canvas.width / canvas.clientWidth;   // drawn at 256 px, shown at 200 px
        crop.x += (e.clientX - drag.x) * s;
        crop.y += (e.clientY - drag.y) * s;
        drag = { x: e.clientX, y: e.clientY };
        drawCrop();
    });
    canvas.addEventListener('pointerup', () => drag = null);
    canvas.addEventListener('pointercancel', () => drag = null);
    $('pfCancelAva').addEventListener('click', cancelCrop);

    $('pfSaveAva').addEventListener('click', async () => {
        const s = store.get();
        if (!s || !crop.img) return;
        const btn = $('pfSaveAva');
        btn.disabled = true;
        try {
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
            const body = new FormData();
            body.append('photo', blob, 'avatar.jpg');
            const r = await api('account/update_photo', { body, token: s.token });
            account.social_data = { ...account.social_data, photo: r.data?.photo };
            cancelCrop();
            fillProfile();
            markChanged('Аватарку збережено');
        } catch (err) {
            say('Не вдалося зберегти аватарку: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    });

    $('pfNickForm').addEventListener('submit', async e => {
        e.preventDefault();
        const s = store.get();
        const nick = $('pfNick').value.trim().replace(/\s+/g, ' ');
        if (!nick) return say('Вкажіть нікнейм');
        if (nick === nickOf(account)) return say('Це ваш поточний нікнейм');
        if (!confirm('Змінити нікнейм на «' + nick + '»? Наступного разу його можна буде змінити через 60 днів.')) return;
        try {
            await api('account', { body: { social_data: { first_name: nick, last_name: '' } }, token: s.token });
            account = await loadAccount();
            fillProfile();
            markChanged('Нікнейм змінено');
        } catch (err) {
            const next = err.data?.next_change_at;
            say(next ? 'Нікнейм можна змінити ' + dateUk(next) : 'Не вдалося змінити нікнейм: ' + err.message);
        }
    });

    $('pfLoginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const s = store.get();
        const login = $('pfLogin').value.trim(), password = $('pfPass').value, password2 = $('pfPass2').value;
        const user = {};
        if (login !== account.login) {
            if (!/^[\p{L}\p{N}_.\-]{3,32}$/u.test(login)) return say('Логін: від 3 до 32 літер, цифр або _ - .');
            user.login = login;
        }
        if (password || password2) {
            if (password.length < 8) return say('Новий пароль: щонайменше 8 символів');
            if (password !== password2) return say('Нові паролі не збігаються');
            if (password.trim() !== password) return say('Пароль не може починатися чи закінчуватися пробілом');
            user.password = password;
            user.password_confirmation = password2;
        }
        if (!Object.keys(user).length) return say('Нічого не змінено');
        try {
            await api('account', { body: { current_password: $('pfCurrent').value, user }, token: s.token });
            if (user.login) store.set({ ...s, login: user.login });
            account = await loadAccount();
            fillProfile();
            $('pfCurrent').value = $('pfPass').value = $('pfPass2').value = '';
            say(user.login && user.password ? 'Логін і пароль змінено' : user.login ? 'Логін змінено: входьте з ним наступного разу' : 'Пароль змінено', 'ok');
        } catch (err) {
            const code = err.data?.error;
            say(code === 'current_password' ? 'Неправильний поточний пароль'
                : code === 'login_taken' ? 'Цей логін уже зайнятий'
                : code === 'login_format' ? 'Логін: від 3 до 32 літер, цифр або _ - .'
                : 'Не вдалося зберегти: ' + err.message);
        }
    });

    // --- Chat ----------------------------------------------------------------------------------
    // One room for everybody and private conversations (api/chat, services/api/internal/app/chat.go). The game
    // opens it from the main menu's "bird with a letter" (it was "Верни бойцов", VK invitations). It is drawn
    // like the game's windows and in its language. The page asks the server for new messages every few seconds:
    // often while the chat is open, rarely while it is closed (for the unread counts and the notice).
    const chatBox = $('chat');
    const chat = { me: null, last: 0, msgs: [], users: {}, peer: null, unread: {}, started: false, timer: null, busy: false };
    const peerKey = m => m.to == null ? null : String(m.from === chat.me ? m.to : m.from);
    const userOf = id => chat.users[id] || { name: 'Игрок ' + id, photo: null };
    const photoOf = u => u.photo || photoUrl(null);
    const timeRu = iso => new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

    async function chatPoll() {
        const s = store.get();
        if (!s || chat.busy) return;
        chat.busy = true;
        try {
            const r = await api('chat?after=' + chat.last, { token: s.token, method: 'GET' });
            chat.me = r.me;
            Object.assign(chat.users, r.users || {});
            const fresh = (r.messages || []).filter(m => m.id > chat.last);
            if (fresh.length) {
                const first = chat.last === 0;
                chat.last = fresh[fresh.length - 1].id;
                chat.msgs.push(...fresh);
                if (!first) for (const m of fresh) if (m.from !== chat.me) noteIncoming(m);
                if (!chatBox.hidden) renderChat();
            }
        } catch { } finally {
            chat.busy = false;
        }
    }

    function chatSchedule() {
        clearTimeout(chat.timer);
        chat.timer = setTimeout(async () => { await chatPoll(); chatSchedule(); }, chatBox.hidden ? 10000 : 2500);
    }

    function startChat() {
        if (chat.started) return;
        chat.started = true;
        chatPoll().then(chatSchedule);
    }

    // A new message: unread counts, and a notice over the game for a private one while the chat isn't showing it.
    function noteIncoming(m) {
        const key = peerKey(m);
        if (!chatBox.hidden && chat.peer === key) return;
        chat.unread[key ?? 'room'] = (chat.unread[key ?? 'room'] || 0) + 1;
        updateBadge();
        if (key !== null) {
            const u = userOf(m.from), t = $('gtoast');
            t.replaceChildren(Object.assign(document.createElement('img'), { src: photoOf(u), alt: '' }),
                Object.assign(document.createElement('span'), { textContent: u.name + ': ' + m.text }));
            t.onclick = () => { t.hidden = true; openChat(key); };
            t.hidden = false;
            clearTimeout(t.timer);
            t.timer = setTimeout(() => t.hidden = true, 6000);
        }
    }

    function updateBadge() {
        // The room's messages count only while the chat is open on another tab; private ones always.
        const n = Object.entries(chat.unread).reduce((a, [k, v]) => a + (k === 'room' ? 0 : v), 0);
        $('chatBadge').hidden = !n;
        $('chatBadge').textContent = n;
    }

    function openChat(peer) {
        const s = store.get();
        if (!s) return;
        startChat();
        closeProfile();
        $('gtoast').hidden = true;
        chat.peer = peer == null || peer === '' || String(peer) === String(s.id) ? null : String(peer);
        chatBox.hidden = false;
        $('gErr').textContent = '';
        renderChat();
        chatPoll().then(() => { renderChat(); chatSchedule(); });
        $('gText').focus();
    }

    function closeChat() {
        if (chatBox.hidden) return;
        chatBox.hidden = true;
        chatSchedule();
        const p = document.querySelector('#game ruffle-player');
        if (p) p.focus();
    }

    function renderChat() {
        delete chat.unread[chat.peer ?? 'room'];
        updateBadge();
        // Tabs: the room, then the conversations, newest first (and the one just opened, even if empty).
        const peers = [];
        for (let i = chat.msgs.length - 1; i >= 0; i--) {
            const k = peerKey(chat.msgs[i]);
            if (k !== null && !peers.includes(k)) peers.push(k);
        }
        if (chat.peer !== null && !peers.includes(chat.peer)) peers.unshift(chat.peer);
        const tabs = $('gTabs');
        tabs.replaceChildren();
        const tab = (key, icon, name) => {
            const el = document.createElement('div');
            el.className = 'gtab' + (chat.peer === key ? ' on' : '');
            el.append(icon, Object.assign(document.createElement('span'), { textContent: name }));
            const n = chat.unread[key ?? 'room'];
            if (n) el.append(Object.assign(document.createElement('b'), { className: 'gnew', textContent: n }));
            el.onclick = () => { chat.peer = key; $('gErr').textContent = ''; renderChat(); $('gText').focus(); };
            tabs.append(el);
        };
        tab(null, Object.assign(document.createElement('b'), { className: 'groom', textContent: '☺' }), 'Общий чат');
        for (const k of peers) {
            const u = userOf(k);
            tab(k, Object.assign(document.createElement('img'), { src: photoOf(u), alt: '' }), u.name);
        }
        $('gHead').textContent = chat.peer === null ? 'Общий чат' : 'Личные сообщения: ' + userOf(chat.peer).name;

        const log = $('gLog');
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        log.replaceChildren();
        const shown = chat.msgs.filter(m => peerKey(m) === chat.peer);
        if (!shown.length) {
            log.append(Object.assign(document.createElement('div'), { className: 'gempty',
                textContent: chat.peer === null ? 'Здесь пока тихо. Напиши первым!' : 'Напиши игроку первое сообщение.' }));
        }
        for (const m of shown) {
            const u = userOf(m.from), mine = m.from === chat.me;
            const row = document.createElement('div');
            row.className = 'gmsg' + (mine ? ' mine' : '');
            const who = Object.assign(document.createElement('span'), { className: 'gwho', textContent: u.name });
            const img = Object.assign(document.createElement('img'), { src: photoOf(u), alt: '' });
            if (!mine) {
                // A name or an avatar opens a private conversation with that player.
                who.title = img.title = 'Написать лично';
                who.onclick = img.onclick = () => { chat.peer = String(m.from); renderChat(); $('gText').focus(); };
                img.style.cursor = 'pointer';
            }
            const body = document.createElement('div');
            body.append(who, Object.assign(document.createElement('time'), { textContent: timeRu(m.at) }),
                Object.assign(document.createElement('p'), { textContent: m.text }));
            row.append(img, body);
            log.append(row);
        }
        if (atBottom || shown.length) log.scrollTop = log.scrollHeight;
    }

    $('gForm').addEventListener('submit', async e => {
        e.preventDefault();
        const s = store.get(), text = $('gText').value.trim();
        if (!s || !text) return;
        const btn = $('gSendBtn');
        btn.disabled = true;
        try {
            await api('chat', { body: { text, ...(chat.peer !== null ? { to: Number(chat.peer) } : {}) }, token: s.token });
            $('gText').value = '';
            $('gErr').textContent = '';
            await chatPoll();
            renderChat();
        } catch (err) {
            $('gErr').textContent = err.status === 429 ? 'Не так быстро: подожди несколько секунд' : 'Не удалось отправить: ' + err.message;
        } finally {
            btn.disabled = false;
            $('gText').focus();
        }
    });
    $('gClose').addEventListener('click', closeChat);
    chatBox.addEventListener('pointerdown', e => { if (e.target === chatBox) closeChat(); });
    chatBox.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); closeChat(); } });
    $('chatBtn').addEventListener('click', () => chatBox.hidden ? openChat() : closeChat());

    // --- Invitation ----------------------------------------------------------------------------
    // "+" in an empty cell of the friends list (VK invitations before): copy the game's address and the
    // player's id, to send to a friend however they like.
    async function invite() {
        const s = store.get();
        if (!s) return;
        const text = 'Заходи в Wormix: ' + location.origin + '/ (мой ID в игре: ' + s.id + ')';
        let copied = false;
        try { await navigator.clipboard.writeText(text); copied = true; } catch { }
        const t = $('gtoast');
        t.replaceChildren(Object.assign(document.createElement('span'), {
            textContent: copied ? 'Ссылка на игру скопирована: отправь её другу!' : text }));
        t.onclick = () => t.hidden = true;
        t.hidden = false;
        clearTimeout(t.timer);
        t.timer = setTimeout(() => t.hidden = true, copied ? 4000 : 12000);
    }

    // --- Called by the game (ExternalInterface; client-patches/standalone-125) ----------------------
    window.wormixChat = () => { setTimeout(() => openChat(), 0); };
    window.wormixProfile = id => { setTimeout(() => openProfile(id), 0); };
    window.wormixInvite = () => { invite(); };
    // The game's full screen button (it called Ruffle's full screen, which Ruffle refused, and whose layout
    // doesn't fit the page): the game's box goes full screen, as Ruffle's own menu item does.
    window.wormixFullscreen = () => {
        const box = $('game');
        if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
        else (box.requestFullscreen ? box.requestFullscreen() : box.webkitRequestFullscreen()).catch?.(() => { });
    };

    window.addEventListener('load', startGame);
</script>
</body>
</html>
